<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Our Special Memories - Ela 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pink-1: #ffdde1;
      --bg-pink-2: #ee9ca7;
      --accent-pink: #ff2a6d;
      --accent-soft: #ff758f;
      --text-main: #4a152b;
      --text-sub: #8a4b66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, var(--bg-pink-1) 0%, var(--bg-pink-2) 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      padding: 28px 18px 40px;
    }

    /* Floating Background Hearts & Sparkles */
    .bg-sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .bg-sparkles span {
      position: absolute;
      bottom: -50px;
      font-size: 22px;
      opacity: 0.7;
      animation: floatUpBg linear infinite;
      filter: drop-shadow(0 4px 8px rgba(255, 42, 109, 0.2));
    }

    .bg-sparkles span:nth-child(1) { left: 6%;  animation-duration: 7.5s; animation-delay: 0s; }
    .bg-sparkles span:nth-child(2) { left: 19%; animation-duration: 9s;   animation-delay: 1.4s; font-size: 26px; }
    .bg-sparkles span:nth-child(3) { left: 34%; animation-duration: 8s;   animation-delay: 2.7s; }
    .bg-sparkles span:nth-child(4) { left: 51%; animation-duration: 10s;  animation-delay: 0.9s; font-size: 25px; }
    .bg-sparkles span:nth-child(5) { left: 68%; animation-duration: 7.2s; animation-delay: 2.1s; }
    .bg-sparkles span:nth-child(6) { left: 82%; animation-duration: 9.2s; animation-delay: 1.1s; font-size: 27px; }
    .bg-sparkles span:nth-child(7) { left: 93%; animation-duration: 8.5s; animation-delay: 3s; }

    @keyframes floatUpBg {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.75;
      }
      50% {
        transform: translateY(-55vh) translateX(16px) rotate(15deg);
      }
      100% {
        transform: translateY(-115vh) translateX(-16px) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Gallery Container */
    .gallery-shell {
      width: 100%;
      max-width: 980px;
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 25px 55px rgba(173, 20, 87, 0.16);
      padding: 32px 26px 34px;
      position: relative;
      z-index: 10;
    }

    .page-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .page-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.92);
      color: var(--accent-pink);
      border: 1px solid #ffc2d4;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 10px;
      box-shadow: 0 4px 12px rgba(255, 42, 109, 0.12);
    }

    .page-header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 46px;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 12.5px;
      color: var(--text-sub);
    }

    /* 5 Polaroid Floating Cards Layout */
    .polaroid-board {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 28px 34px;
      padding: 12px 8px 20px;
    }

    .polaroid-card {
      width: 175px;
      background: #ffffff;
      padding: 10px 10px 14px;
      border-radius: 6px;
      box-shadow: 0 14px 28px rgba(120, 25, 62, 0.18);
      position: relative;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      --base-rot: 0deg;
      transform: rotate(var(--base-rot));
      animation: polaroidFloat 4.2s ease-in-out infinite;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
    }

    .polaroid-card:nth-child(1) {
      --base-rot: -6deg;
      animation-delay: 0s;
      animation-duration: 4.1s;
    }

    .polaroid-card:nth-child(2) {
      --base-rot: 5deg;
      animation-delay: 0.7s;
      animation-duration: 4.6s;
    }

    .polaroid-card:nth-child(3) {
      --base-rot: -4deg;
      animation-delay: 1.3s;
      animation-duration: 4.3s;
    }

    .polaroid-card:nth-child(4) {
      --base-rot: 6deg;
      animation-delay: 0.4s;
      animation-duration: 4.8s;
    }

    .polaroid-card:nth-child(5) {
      --base-rot: -5deg;
      animation-delay: 1.0s;
      animation-duration: 4.4s;
    }

    @keyframes polaroidFloat {
      0%, 100% {
        transform: translateY(0px) rotate(var(--base-rot));
      }
      50% {
        transform: translateY(-10px) rotate(calc(var(--base-rot) + 1.8deg));
      }
    }

    .polaroid-card:hover {
      animation-play-state: paused;
      transform: translateY(-14px) scale(1.06) rotate(0deg);
      box-shadow: 0 22px 38px rgba(255, 42, 109, 0.28);
      z-index: 15;
    }

    /* Top-right cute heart pin like the reference image */
    .heart-pin {
      position: absolute;
      top: -11px;
      right: -8px;
      font-size: 23px;
      z-index: 5;
      transform: rotate(16deg);
      filter: drop-shadow(0 4px 6px rgba(255, 42, 109, 0.3));
      pointer-events: none;
    }

    .polaroid-img-wrap {
      width: 100%;
      height: 175px;
      border-radius: 3px;
      overflow: hidden;
      background: #ffe8ef;
    }

    .polaroid-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .polaroid-caption {
      margin-top: 10px;
      text-align: center;
      font-family: 'Sacramento', cursive;
      font-size: 25px;
      line-height: 1.15;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    /* Bottom Navigation */
    .bottom-nav {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: linear-gradient(135deg, #ff2a6d, #ff758f);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 6px 16px rgba(255, 42, 109, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 9px 22px rgba(255, 42, 109, 0.34);
    }

    .nav-btn.secondary {
      background: rgba(255, 255, 255, 0.92);
      color: var(--text-main);
      border: 1px solid #ffc2d4;
      box-shadow: 0 4px 12px rgba(255, 42, 109, 0.1);
    }

    /* Special Message Modal when a Polaroid is Clicked */
    .memory-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(58, 12, 32, 0.55);
      backdrop-filter: blur(7px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .memory-modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .memory-modal-card {
      width: 100%;
      max-width: 390px;
      background: #fff9fb;
      border-radius: 26px;
      border: 2px solid #ffffff;
      box-shadow: 0 25px 60px rgba(80, 10, 40, 0.35);
      padding: 20px 20px 24px;
      text-align: center;
      position: relative;
      transform: scale(0.88) translateY(16px);
      transition: transform 0.32s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .memory-modal-backdrop.active .memory-modal-card {
      transform: scale(1) translateY(0);
    }

    .close-modal-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #ffe3ec;
      color: var(--accent-pink);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .close-modal-btn:hover {
      transform: scale(1.08);
      background: #ffd1e0;
    }

    .modal-photo-frame {
      background: #ffffff;
      padding: 9px 9px 12px;
      border-radius: 10px;
      box-shadow: 0 10px 22px rgba(173, 20, 87, 0.14);
      margin-bottom: 14px;
    }

    .modal-photo-frame img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .modal-tag {
      display: inline-block;
      background: #ffe6ee;
      color: var(--accent-pink);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .modal-title {
      font-family: 'Great Vibes', cursive;
      font-size: 36px;
      color: var(--accent-pink);
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .modal-note {
      font-family: 'Sacramento', cursive;
      font-size: 27px;
      line-height: 1.38;
      color: var(--text-main);
    }

    @media (max-width: 600px) {
      .gallery-shell {
        padding: 24px 16px 26px;
        border-radius: 24px;
      }
      .page-header h1 {
        font-size: 38px;
      }
      .polaroid-board {
        gap: 22px 16px;
      }
      .polaroid-card {
        width: 145px;
        padding: 8px 8px 12px;
      }
      .polaroid-img-wrap {
        height: 145px;
      }
      .polaroid-caption {
        font-size: 22px;
      }
      .modal-note {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-sparkles">
    <span>💖</span>
    <span>✨</span>
    <span>🎈</span>
    <span>💕</span>
    <span>🌸</span>
    <span>💗</span>
    <span>🎂</span>
  </div>

  <div class="gallery-shell">
    <div class="page-header">
      <div class="page-badge">📸 Tap Any Memory Card</div>
      <h1>Little Moments With Ela</h1>
      <p>Every picture holds a special feeling that words barely capture ✨</p>
    </div>

    <!-- ৫টি ফ্লোটিং পোলারয়েড ফ্রেম: নিজের ছবির নাম (p1.jpeg থেকে p5.jpeg) ও বিশেষ লেখা নিচের memoriesData অ্যারেতে বদলে নেবেন -->
    <div class="polaroid-board" id="polaroidBoard"></div>

    <div class="bottom-nav">
      <a href="chithi.html" class="nav-btn secondary">← Back to Letter</a>
      <a href="index.html" class="nav-btn">🔒 Lock Screen</a>
    </div>
  </div>

  <!-- ক্লিক করলে বিশেষ কথা দেখার পপ-আপ -->
  <div class="memory-modal-backdrop" id="memoryModal" onclick="handleBackdropClick(event)">
    <div class="memory-modal-card">
      <button class="close-modal-btn" onclick="closeMemoryModal()" aria-label="Close">✕</button>
      <div class="modal-photo-frame">
        <img id="modalImg" src="" alt="Special Memory">
      </div>
      <div class="modal-tag" id="modalTag">Special Memory</div>
      <h2 class="modal-title" id="modalTitle">Title</h2>
      <p class="modal-note" id="modalNote">Special message goes here...</p>
    </div>
  </div>

  <script>
    // এখানে আপনার ৫টি ছবির ফাইলের নাম, ক্যাপশন এবং প্রতিটি ছবির জন্য আলাদা বিশেষ কথা লিখে দিন
    const memoriesData = [
      {
        image: "first.jpeg",
        caption: "Baddie 😎",
        tag: "Memory 01 💖",
        title: "Effortlessly Iconic",
        note: "Even when you act all cool and fierce, my heart still skips a beat looking at you. Never change that spark."
      },
      {
        image: "second.jpeg",
        caption: "Beautiful 🌸",
        tag: "Memory 02 ✨",
        title: "Soft & Radiant",
        note: "There is a calm, gentle beauty in this moment that feels just like a warm breeze on a quiet afternoon."
      },
      {
        image: "third.jpeg",
        caption: "Dream Girl 💫",
        tag: "Memory 03 🌙",
        title: "My Favorite Daydream",
        note: "Out of all the dreams I have ever had, the ones where you are smiling right beside me are my favorite."
      },
      {
        image: "forth.jpeg",
        caption: "Always You ✨",
        tag: "Memory 04 💕",
        title: "In Every Season",
        note: "No matter how days pass or seasons change, my heart keeps choosing the exact same person—always you."
      },
      {
        image: "fifth.jpeg",
        caption: "My Love 💖",
        tag: "Memory 05 🎂",
        title: "Happy Birthday, Ela",
        note: "Thank you for being my safe place, my happiness, and my favorite reason to smile. Happy Birthday, my love!"
      }
    ];

    const boardEl = document.getElementById("polaroidBoard");
    const modalEl = document.getElementById("memoryModal");
    const modalImgEl = document.getElementById("modalImg");
    const modalTagEl = document.getElementById("modalTag");
    const modalTitleEl = document.getElementById("modalTitle");
    const modalNoteEl = document.getElementById("modalNote");

    function renderPolaroids() {
      boardEl.innerHTML = "";

      memoriesData.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "polaroid-card";
        card.onclick = () => openMemoryModal(index);

        card.innerHTML = `
          <div class="heart-pin">💖</div>
          <div class="polaroid-img-wrap">
            <img src="${item.image}" alt="${item.caption}">
          </div>
          <div class="polaroid-caption">${item.caption}</div>
        `;

        boardEl.appendChild(card);
      });
    }

    function openMemoryModal(index) {
      const item = memoriesData[index];
      if (!item) return;

      modalImgEl.src = item.image;
      modalImgEl.alt = item.caption;
      modalTagEl.textContent = item.tag;
      modalTitleEl.textContent = item.title;
      modalNoteEl.textContent = item.note;

      modalEl.classList.add("active");
    }

    function closeMemoryModal() {
      modalEl.classList.remove("active");
    }

    function handleBackdropClick(event) {
      if (event.target === modalEl) {
        closeMemoryModal();
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeMemoryModal();
      }
    });

    renderPolaroids();
  </script>
</body>
</html>
